    <body>
        <header>
            <h1>Practica_Observer1</h1>
            <p>Bienvenido</p>
        </header>
        <main>
        </main>
        <script>
            class Persona{
                constructor(nombre){
                    this.nombre = nombre;
                }
                saludar(){
                    console.log(`hola, Soy ${this.nombre}`);
                }
            }
            const p1 = new Persona(" Pedro ");
            p1.saludar();
     class Subject {
    constructor() {
        this.observadores = []; //  aqui a guardar la lista
    }

    subscribe(observer) {
        this.observadores.push(observer);
    }

    unsubscribe(observer) {
        this.observadores = this.observadores.filter(obs => obs !== observer);
    }

    notify(data) {
        this.observadores.forEach(obs => obs(data));
    }

    get observerCount() {
        return this.observadores.length;
    }
}
const subject = new Subject();

function observer1(data) { console.log("Observer 1 recibió:", data); }
function observer2(data) { console.log("Observer 2 recibió:", data); }
function observer3(data) { console.log("Observer 3 recibió:", data); }

subject.subscribe(observer1);
subject.subscribe(observer2);
subject.subscribe(observer3);

console.log(subject.observerCount); // 3

subject.unsubscribe(observer1);

console.log(subject.observerCount); // 2

subject.notify("Hola a todos");
// Observer 2 recibió: Hola a todos
// Observer 3 recibió: Hola a todos
console.log("Cantidad de observers:", subject.observerCount);
        </script>
    </body>
</html>
