        <header>
            <h1>Practica_Matriz_a4_42</h1>
        </header>
        <main>

        </main>
        <script>
            const entrada =[
   [1, 2, 3],
  [4, 5, 6],
  [7, 8, 9]  
            ];

           const fila_suma = entrada
           .map(fila=>{
            return fila.reduce((suma,numero)=>{
                return suma + numero;
            },0);
           });
           console.log("filas sumadas ",fila_suma);
           const final = entrada.reduce((columna_sumada,fila)=>{
                fila.forEach((valor,posicion)=>{
                    columna_sumada[posicion] =  (columna_sumada[posicion] || 0) + valor;
                });
                return columna_sumada;
           },[]);
           console.log("Columnas sumadas ",final);
        </script>
