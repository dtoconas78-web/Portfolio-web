        <script>
           const numeros = [1, 3, 4, 4, 2, 1, 4, 2];
           const miorepet = numeros.reduce((objeto,array)=>{
            const propiedad_clave = array;
            if(!objeto[propiedad_clave]){
                objeto[propiedad_clave]=0;
            }
            objeto[propiedad_clave] = objeto[propiedad_clave] +1;
            return objeto;
           },{});
           console.log("cuantas veces se repite", miorepet);
           const final= Object.entries(miorepet)
           .reduce((masfrecuente,iterado)=>{
            if(masfrecuente[1]<iterado[1]){
                return iterado;
            }else{
                return masfrecuente;
            }
           });
           console.log("El número repetido ", final);
        </script>
