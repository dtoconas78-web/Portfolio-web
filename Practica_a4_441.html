const a = {

};

};
function comparar(obj1,obj2){
    const clave1 = Object.keys(obj1);
    const clave2 = Object.keys(obj2);
    console.log("clave 1 de objt",clave1);
    console.log("clave 2 de objt",clave2);

    if(clave1.length !== clave2.length){
        return false;
    }

    //iterador toma de la lista de claves e cada obj toma x e y de a y b
    for(const iterador of clave1){
        const valor1 = obj1[iterador];
        const valor2 = obj2[iterador];
        console.log("valor dentro for",valor1);
        console.log("valor dentro for",valor2);
        const esObjeto = typeof valor1 === "object" && valor1 !== null;
        const esObjeto2 = typeof valor2 === "object" && valor2 !== null;
        if(esObjeto && esObjeto2){
            if(!comparar(valor1,valor2)){
                return false;
            }
        }else{
                if(valor1 !== valor2){
                    return false;
                }
            }
    
    }
    return true;
    
}

console.log("Mio merge --.------------");
const obj1 =
{
    usuario:{
        nombre:"Ana",
        edad:20
    },
    activo:true
}
const obj2 =
{
    usuario:{
        ciudad:"Mendoza"
    }
}
function merge(obj1,obj2){
    const combinado = {...obj1};
    
    for(const clave of Object.keys(obj2)){
        const dato1 = obj1[clave];
        const dato2 = obj2[clave];

        const esObjeto = typeof dato1 === "object" && dato1 !== null;
        const esObjeto2 = typeof dato2 === "object" && dato2 !== null;
        if(esObjeto && esObjeto2){
            combinado[clave] =merge(dato1,dato2);
        }else{
            combinado[clave] = dato2;
        }

    }

    return combinado;
}
console.log("Merge  ",merge(obj1,obj2));
