<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Practica_IntersectionObserver</title>
    <style>
        .caja{
            height: 400px;
            margin: 150px;
            background-color: lightblue;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;

            opacity: 0;
            transform: translateY(50px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .visible {
    opacity: 1;
    transform: translateY(0);
}
    </style>
</head>
<body>
    <div class="caja">Caja 1</div>
    <div class="caja">Caja 2</div>
    <div class="caja">Caja 3</div>
    <div class="caja">Caja 4</div>
<script>
    const cajas = document.querySelectorAll(".caja");

    const observer = new IntersectionObserver((entradas)=>{
        entradas.forEach((entrada_iterada)=>{
            if(entrada_iterada.isIntersecting){
                console.log("Detecté que entró en pantalla:", entrada_iterada.target.textContent);
                entrada_iterada.target.classList.add("visible");
                observer.unobserve(entrada_iterada.target);
            }
        });
    });
    cajas.forEach((caja)=>{
        observer.observe(caja);
    });

    
</script>
</body>
</html>
